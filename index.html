<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Egg Counter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>🥚 Egg Counter</h1>

    <section class="counter" aria-live="polite">
      <div id="total" class="total">0</div>
      <div id="dozens" class="dozens">0 dozen + 0</div>
    </section>

    <section class="buttons">
      <button id="minus1" class="btn minus" aria-label="Remove one egg">−1</button>
      <button id="plus1" class="btn plus big" aria-label="Add one egg">+1</button>
      <button id="minus12" class="btn minus" aria-label="Remove a dozen eggs">−12</button>
      <button id="plus12" class="btn plus" aria-label="Add a dozen eggs">+12</button>
    </section>

    <section class="today">
      <span>Collected today:</span> <strong id="today">0</strong>
    </section>

    <section class="log">
      <h2>Daily log</h2>
      <ul id="log"></ul>
      <p id="empty" class="empty">No eggs counted yet.</p>
    </section>

    <button id="reset" class="btn reset">Reset everything</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
